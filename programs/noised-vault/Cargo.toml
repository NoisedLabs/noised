[package]
name = "noised-vault"
version = "0.2.0"
description = "Post-quantum token vaults: funds move only with an LM-OTS (RFC 8554) hash-based signature"
edition.workspace = true
license.workspace = true
# Deployed on-chain, never published to a registry (cargo-deny also requires
# this for crates with path dependencies).
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "noised_vault"

[features]
default = []
# Use as a library: no program entrypoint, global allocator or panic handler.
no-entrypoint = []
cpi = ["no-entrypoint"]
# Skip the `Instruction: <Name>` log line each instruction starts with.
no-log-ix-name = []

# Written without a framework (no Anchor): the on-chain binary links only
# pinocchio (entrypoint, account views, CPI, syscalls), the LM-OTS verifier
# and the sol_sha256 wrapper. The ABI (instruction, account and event
# layouts, discriminators, error numbers) is the Anchor 1.2.1 build's,
# byte for byte; `idls/noised_vault.json` describes it.
[dependencies]
noised-lmots = { workspace = true }
pinocchio = { workspace = true }
solana-sha256-hasher = { workspace = true }

# Host only (clients and tests), never in the on-chain binary: the Anchor
# client API the test suites build instructions and read accounts with
# (`accounts`, `instruction`, `AccountDeserialize` on `Vault` and `Payout`),
# and PDA derivation off-chain.
[target.'cfg(not(target_os = "solana"))'.dependencies]
anchor-lang = { workspace = true }
solana-address = { version = "2.7", features = ["curve25519"] }

# Differential tests: the program's own parsers and account resolution
# against the SPL crates the Anchor build used.
[dev-dependencies]
anchor-spl = { workspace = true }
bytemuck = "=1.25.2"
noised-lmots = { workspace = true, features = ["signer", "sha2-backend"] }
serde_json = "1"
solana-account-info = "=3.1.1"
solana-instruction = "=3.5.1"
solana-program-error = "=3.0.1"
solana-rent = "=3.1.0"
spl-discriminator = { workspace = true }
spl-pod = "=0.7.4"
spl-tlv-account-resolution = { workspace = true }
spl-transfer-hook-interface = { workspace = true }
spl-type-length-value = "=0.9.1"

[lints]
workspace = true

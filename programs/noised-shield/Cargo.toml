[package]
name = "noised-shield"
version = "0.1.0"
description = "Opt-in privacy: wrap a token 1:1 into a Token-2022 zToken with confidential balances"
edition.workspace = true
license.workspace = true
# Deployed on-chain, never published to a registry (cargo-deny also requires
# this for crates with path dependencies).
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "noised_shield"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
anchor-spl = { workspace = true }
spl-transfer-hook-interface = { workspace = true }
spl-tlv-account-resolution = { workspace = true }

# LiteSVM tests live in tests/litesvm (their own workspace, see the root Cargo.toml).

[lints]
workspace = true

[package]
name = "noised-autopilot"
version = "0.1.0"
description = "Noised Autopilot: PXG1 automation graphs that run a launched token's treasury (buy back and burn, burn, pay declared recipients) inside fixed on-chain bounds, changed only by the creator's post-quantum identity after a 72-hour timelock"
edition.workspace = true
license.workspace = true
# Deployed on-chain, never published to a registry (cargo-deny also requires
# this for crates with path dependencies).
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "noised_autopilot"

[features]
default = []
# Use as a library: no program entrypoint, global allocator or panic handler.
no-entrypoint = []
cpi = ["no-entrypoint"]
# Skip the `Instruction: <Name>` log line each instruction starts with.
no-log-ix-name = []

# Written without a framework (no Anchor): the on-chain binary links only
# pinocchio (entrypoint, account views, CPI, syscalls), noised-onchain (the
# shared Anchor-compatible account checks, errors, SPL Token / Token-2022
# parsing and CPIs, built on pinocchio and the sol_sha256 wrapper) and the
# PXG1 verifier and evaluator (noised-rules, no features on-chain:
# allocation-free). The ABI (instruction, account and event layouts,
# discriminators, error numbers) is the Anchor 1.2.1 build's, byte for byte;
# `idls/noised_autopilot.json` describes it and `anchor/` keeps the Anchor
# source it implements (with the review-F1 price-condition change, as src/).
[dependencies]
noised-onchain = { workspace = true }
noised-rules = { workspace = true }
pinocchio = { workspace = true }

# Host only (clients and tests), never in the on-chain binary: the Anchor
# client API the test suites build instructions and read accounts with
# (`accounts`, `instruction`, `AccountDeserialize` on `Autopilot` and
# `GraphRecord`, `Event` on the events).
[target.'cfg(not(target_os = "solana"))'.dependencies]
anchor-lang = { workspace = true }

[dev-dependencies]
# Host tests encode graphs and hash with the sha2 backend.
noised-rules = { workspace = true, features = ["alloc", "sha2-backend"] }
# Pins the launchpad account layouts the autopilot reads by offset
# (`launchpad.rs`) against the launchpad's own types.
noised-launchpad = { path = "../noised-launchpad", features = ["no-entrypoint"] }
# ABI tests: the layouts against Anchor's serialization, the IDL and Borsh,
# the CPIs against the SPL builders.
anchor-spl = { workspace = true }
serde_json = "1"

[lints]
workspace = true

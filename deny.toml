# cargo-deny policy for the root workspace (the on-chain programs and crates).
# Run: cargo deny check
# The LiteSVM test workspaces are host-only and checked separately.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities always fail. Only "unmaintained" notices for crates that the
# Solana / Anchor dependency tree requires are acknowledged here; re-check them
# on every Anchor/Solana upgrade.
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x: unmaintained; required transitively by solana crates, no known vulnerability" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

name: release

# Publishes a release when the owner pushes a version tag (vX.Y.Z, or
# vX.Y.Z-rc.N for a pre-release):
#
# 1. preflight: the tag is on main; the repository location is set
#    (scripts/release/repo-config.json, no placeholder) and written everywhere;
#    both npm packages pass scripts/release/prepare-publish.mjs --check.
# 2. ci: the whole of ci.yml (formatting, lints, every Rust suite against the
#    mainnet dumps, the Python references, cargo-deny, SDK, app and MCP).
# 3. programs: verifiable (Docker, solana-verify) SBPF v3 builds of the five
#    programs, their SHA-256 sums and on-chain-comparable executable hashes,
#    and a signed SLSA build-provenance attestation.
# 4. npm: @noisedlabs/sdk, then @noisedlabs/mcp, with npm provenance, through npm
#    trusted publishing (GitHub OIDC): no long-lived npm token is stored.
# 5. crates: noised-lmots and noised-rules, through crates.io trusted
#    publishing (OIDC); a crate-scoped token secret is the fallback.
# 6. github-release: the .so files, SHA256SUMS, the executable hashes and the
#    program IDLs attached to the GitHub release of the tag.
#
# A version already on its registry is skipped, so one tag releases only the
# packages whose version changed. The jobs that publish run in the `release`
# environment: give it required reviewers (Settings > Environments) so nothing
# is published without the owner's approval. Run it by hand
# (workflow_dispatch) for a full dry run: everything is built and packed,
# nothing is published.
#
# One-time setup (docs/OPERATIONS.md, "Releases"):
# - npm: for @noisedlabs/sdk and @noisedlabs/mcp, add a trusted publisher (GitHub
#   Actions, this repository, workflow file `release.yml`, environment
#   `release`). If npm requires the package to exist first, publish the first
#   version with a granular, short-lived token stored as the secret
#   NPM_BOOTSTRAP_TOKEN (environment `release`), then configure the trusted
#   publisher and delete the token and the secret.
# - crates.io: for noised-lmots and noised-rules, add a trusted publisher
#   (repository, workflow `release.yml`, environment `release`). Until a crate
#   exists on crates.io, or instead of OIDC, store a token scoped to
#   publish-new/publish-update of these two crates as the secret
#   CARGO_REGISTRY_TOKEN (environment `release`); delete it once trusted
#   publishing works.
#
# Every action is pinned to a commit SHA, every tool to an exact version or a
# checksum. Keep RUST_TOOLCHAIN and the Agave pins equal to ci.yml.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.98.0"
  NODE_VERSION: "22"
  # npm >= 11.5.1 publishes through trusted publishing (OIDC).
  NPM_VERSION: "11.20.0"
  SOLANA_VERIFY_VERSION: "0.5.2"
  DRY_RUN: ${{ github.event_name != 'push' }}
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: preflight (tag on main, repository location, package checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: The tagged commit is on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Repository location is set and written everywhere
        run: |
          owner=$(node -p 'require("./scripts/release/repo-config.json").owner')
          if [ "$owner" = "TBD" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::scripts/release/repo-config.json still has the placeholder owner TBD"; exit 1
          fi
          node scripts/release/apply-repo-config.mjs --check
      - name: npm packages are publishable
        if: env.DRY_RUN != 'true'
        run: |
          node scripts/release/prepare-publish.mjs sdk --check
          node scripts/release/prepare-publish.mjs packages/noised-mcp --check

  ci:
    name: full CI
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  programs:
    name: verifiable program builds
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      # Exactly what `solana-verify verify-from-repo` replays: the repository
      # root as mount path, the image that [workspace.metadata.cli] solana =
      # "4.3.0" selects (cargo-build-sbf 4.3.0, platform-tools v1.57), and
      # solana-verify's own --arch flag, which it passes to cargo build-sbf
      # (arguments after `--` would go to cargo build, which has no --arch).
      - name: Deterministic SBPF v3 builds with solana-verify (Docker)
        run: |
          cargo install solana-verify --version "$SOLANA_VERIFY_VERSION" --locked
          for lib in noised_hook noised_vault noised_launchpad noised_shield noised_autopilot; do
            solana-verify build --library-name "$lib" --arch v3
          done
          docker images --digests solanafoundation/solana-verifiable-build
      - name: Hashes and release files
        run: |
          mkdir -p release
          for lib in noised_hook noised_vault noised_launchpad noised_shield noised_autopilot; do
            so="target/deploy/$lib.so"
            flags=$(python3 -c "import struct,sys; print(struct.unpack_from('<I', open(sys.argv[1],'rb').read(64), 48)[0])" "$so")
            test "$flags" = "3" || { echo "::error::$so is not SBPF v3 (e_flags $flags)"; exit 1; }
            cp "$so" release/
            cp "idls/$lib.json" "release/$lib.idl.json"
            # The hash `solana-verify get-program-hash -u mainnet <program id>`
            # prints for the deployed program (trailing zero padding removed).
            printf '%s  %s\n' "$(solana-verify get-executable-hash "$so")" "$lib.so" >> release/EXECUTABLE_HASHES
          done
          (cd release && sha256sum -- *.so *.idl.json EXECUTABLE_HASHES > SHA256SUMS)
          cat release/EXECUTABLE_HASHES release/SHA256SUMS
      - name: Build provenance attestation
        if: env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.so
            release/*.idl.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-programs
          path: release/
          if-no-files-found: error

  npm:
    name: npm (@noisedlabs/sdk, @noisedlabs/mcp)
    needs: [ci, programs]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The approval gate; a dry run (workflow_dispatch) publishes nothing and needs none.
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    env:
      # Only for a first publish before the trusted publisher exists; npm uses
      # OIDC first when it is configured. Delete the secret afterwards.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
      pnpm_config_store_dir: ${{ github.workspace }}/../pnpm-store
      pnpm_config_cache_dir: ${{ github.workspace }}/../pnpm-cache
      pnpm_config_state_dir: ${{ github.workspace }}/../pnpm-state
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.8.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: npm CLI for trusted publishing
        run: npm install -g "npm@${NPM_VERSION}" && npm --version
      - name: Build the SDK
        working-directory: sdk
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build the MCP server (installs the SDK built above)
        working-directory: packages/noised-mcp
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Publish @noisedlabs/sdk, then @noisedlabs/mcp
        run: |
          set -euo pipefail
          for dir in sdk packages/noised-mcp; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if [ "$DRY_RUN" = "true" ]; then
              node scripts/release/prepare-publish.mjs "$dir" --check || true
              (cd "$dir" && npm pack --dry-run)
              continue
            fi
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm: skipped"
              continue
            fi
            # Turns file: links to this repository's packages into exact versions.
            node scripts/release/prepare-publish.mjs "$dir"
            (cd "$dir" && npm publish --provenance --access public)
          done

  crates:
    name: crates.io (noised-lmots, noised-rules)
    needs: [ci, programs]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    env:
      HAS_CRATES_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: crates.io token through trusted publishing (OIDC)
        id: auth
        if: env.DRY_RUN != 'true' && env.HAS_CRATES_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish noised-lmots, then noised-rules
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          for crate in noised-lmots noised-rules; do
            version=$(cargo metadata --no-deps --format-version 1 --locked \
              | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']==sys.argv[1]))" "$crate")
            if [ "$DRY_RUN" = "true" ]; then
              cargo package -p "$crate" --list --locked
              cargo publish -p "$crate" --dry-run --locked
              continue
            fi
            status=$(curl -sS -o /dev/null -w '%{http_code}' -A "noised-release (github.com/$GITHUB_REPOSITORY)" \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$status" = "200" ]; then
              echo "$crate $version is already on crates.io: skipped"
              continue
            fi
            cargo publish -p "$crate" --locked
          done

  github-release:
    name: GitHub release with verifiable builds
    needs: [programs, npm, crates]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-programs
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          {
            echo "Release $tag of $GITHUB_REPOSITORY (commit $GITHUB_SHA)."
            echo
            echo "## Program builds"
            echo
            echo "Built by this workflow with solana-verify $SOLANA_VERIFY_VERSION (Docker), SBPF v3, from the tagged commit: \`solana-verify build --library-name <lib> --arch v3\`."
            echo "Each .so has a signed build-provenance attestation: \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
            echo
            echo "| Program | Program ID |"
            echo "|---|---|"
            echo "| noised_launchpad | CfbRmsFpevhiXkbYK48orBDugdKznnezDiVekjAAbNgc |"
            echo "| noised_hook | cHHLLsEH4eHmqZBT4X5XqzutmkFw3daWSySPtV4csia |"
            echo "| noised_vault | 7BQ6FQomidBkd5z7fQfwr9Zt87oahMvMV5dFnw6Dz7nb |"
            echo "| noised_shield | BUMHJyoS6JCz4pZDfryzXbFDorXb9nmGkj3ziR71z8E9 |"
            echo "| noised_autopilot | D5fuqCXNP7BkU3CyNrpZUFStgdZ6XwRkpURiK9v5esbx |"
            echo
            echo "Compare a deployed program with this release (the hash ignores the account's zero padding):"
            echo
            echo '```sh'
            echo "solana-verify get-program-hash -u mainnet <program id>   # must equal the line in EXECUTABLE_HASHES"
            echo "sha256sum -c SHA256SUMS                                   # the files you downloaded"
            echo '```'
            echo
            echo "EXECUTABLE_HASHES:"
            echo
            echo '```'
            cat release/EXECUTABLE_HASHES
            echo '```'
          } > notes.md
          prerelease=()
          case "$tag" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$tag" --notes-file notes.md "${prerelease[@]}" \
            release/*.so release/*.idl.json release/SHA256SUMS release/EXECUTABLE_HASHES

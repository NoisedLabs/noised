[package]
name = "noised-rules"
version = "0.1.0"
description = "PXR1 launch rules and PXG1 autopilot graphs for Noised: allocation-free codecs, verifiers and evaluators shared by the on-chain programs and the clients"
edition.workspace = true
license.workspace = true
# Oldest toolchain tested: Rust 1.95 (Solana platform-tools v1.57).
rust-version = "1.95"
readme = "README.md"
# Set from scripts/release/repo-config.json (apply-repo-config.mjs writes the
# root [workspace.package]).
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/noised-rules"
keywords = ["solana", "no-std", "rules", "automation"]
categories = ["no-std", "encoding"]
# Only crates.io, and only from the release workflow (.github/workflows/release.yml)
# after the owner pushes a version tag: crates.io versions cannot be deleted.
publish = ["crates-io"]
# Ship the library only: the tests and their parity vectors stay in the repository.
include = ["/src/**/*.rs", "/README.md", "/LICENSE", "/NOTICE"]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "noised_rules"

[features]
default = []
# Owned programs (`RulesProgram`, `GraphProgram`) and their encoders, for
# clients, tools and tests. The on-chain paths never allocate.
alloc = []
std = ["alloc"]
# SHA-256 backend on the `sha2` crate, for clients and tests.
sha2-backend = ["dep:sha2"]

[dependencies]
sha2 = { version = "0.10", default-features = false, optional = true }

[dev-dependencies]
# The tests use the encoders and the sha2 backend: a dev-dependency on the
# crate itself enables them for `cargo test` without changing the library's
# default (allocation-free) build.
noised-rules = { path = ".", features = ["alloc", "sha2-backend"] }
serde_json = "1"

[lints]
workspace = true
